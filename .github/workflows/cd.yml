name: CD - Push and Deploy

on:
  workflow_run:
    workflows: ["CI - Build Docker Images"]
    types:
      - completed
    branches: [develop]

jobs:
  push-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petcheck-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petcheck-backend:${{ github.event.workflow_run.head_sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petcheck-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petcheck-frontend:${{ github.event.workflow_run.head_sha }}
          build-args: |
            VITE_API_BASE_URL=

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,scripts/deploy.sh,.env.prod.example"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -f docker-compose.prod.yml ]; then
              echo "Missing docker-compose.prod.yml in $DEPLOY_PATH"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "Missing .env — create it once on the server:"
              echo "  cp .env.prod.example .env && nano .env"
              exit 1
            fi

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            export DOCKERHUB_USERNAME

            chmod +x scripts/deploy.sh 2>/dev/null || true
            if [ -f scripts/deploy.sh ]; then
              COMPOSE_FILE=docker-compose.prod.yml bash scripts/deploy.sh
            else
              docker compose -f docker-compose.prod.yml pull backend frontend
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
              docker compose -f docker-compose.prod.yml ps
            fi

            docker image prune -f
