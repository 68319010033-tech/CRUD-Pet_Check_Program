version: '3.8'

services:
  postgres-db:
    image: postgres:latest
    container_name: petcheck-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Achirawit123
      POSTGRES_DB: petcheckdb
    ports:
      - "5432:5432"
    volumes:
      # Change this line to point to the base folder
      - postgres_data:/var/lib/postgresql 
    restart: always

  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    image: petcheck-backend:local
    container_name: petcheck-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_NAME=petcheckdb
      - DB_USER=postgres
      - DB_PASSWORD=Achirawit123
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - JWT_ACCESS_SECRET=petcheck-access-secret-dev
      - JWT_REFRESH_SECRET=petcheck-refresh-secret-dev
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - REQUIRE_EMAIL_VERIFICATION=true
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:5000
      - EMAIL_FROM=${EMAIL_FROM:-CozyTail <noreply@cozytail.local>}
      - SMTP_SERVICE=${SMTP_SERVICE:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      - postgres-db
    restart: always

  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
    image: petcheck-frontend:local
    container_name: petcheck-frontend
    ports:
      - "5173:80" # <-- Map your local 5173 to container's Nginx port 80
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data: